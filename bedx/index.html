<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101516">
  <title>BEDX · 命中反馈实验台</title>
  <link rel="stylesheet" href="lab.css?v=2">
  <script defer src="src/target.js?v=2"></script>
  <script defer src="src/foley.js?v=2"></script>
  <script defer src="src/sound.js?v=2"></script>
  <script defer src="src/scene.js?v=2"></script>
  <script defer src="src/lab.js?v=2"></script>
</head>
<body>
  <header class="site-head">
    <div class="wrap topbar">
      <div class="brand" aria-label="BEDX"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>BEDX</div>
      <a href="https://www.asoundeffect.com/apex-legends-sound/" target="_blank" rel="noreferrer">音效设计访谈 <span aria-hidden="true">↗︎</span></a>
    </div>
  </header>
  <main class="wrap">
    <section class="intro">
      <div>
        <h1>命中反馈实验台</h1>
        <p>按住晶体连续射击，听护盾受击、破裂到本体被击倒的变化。</p>
      </div>
      <button class="demo" id="demo" type="button"><span class="play-icon" aria-hidden="true"></span><span id="demo-label">演示连击</span></button>
    </section>

    <div class="workspace">
      <section class="panel range-panel" aria-labelledby="range-heading">
        <div class="panel-head"><h2 id="range-heading"><span class="scope-icon" aria-hidden="true"></span>交互靶场</h2>
          <button class="quiet" id="reset" type="button"><span aria-hidden="true">↺</span> 重置</button>
        </div>
        <div class="field">
          <canvas id="field" tabindex="0" role="button" aria-label="训练晶体，按住空格或回车可连续命中，点击空处可对比未命中射击">可用下方按钮演示完整命中序列。</canvas>
          <div class="vitals">
            <div class="vital shield"><span>护盾</span><i><b id="shield-bar"></b></i><output id="shield">60</output></div>
            <div class="vital health"><span>生命</span><i><b id="health-bar"></b></i><output id="health">100</output></div>
          </div>
          <div class="target-state" id="target-state">护盾在线</div>
        </div>
        <div class="field-guide"><span>点按单发 · 按住连发</span><span class="key-guide"><kbd>Space</kbd> 中央命中</span><span class="key-guide"><kbd>R</kbd> 重置</span></div>
        <fieldset class="weapon-settings">
          <legend class="sr-only">射击参数</legend>
          <label for="rpm">射速 <span class="number-unit"><input id="rpm" type="number" min="1" max="1800" step="1" value="450" inputmode="numeric" required aria-describedby="cadence config-status"><span>RPM</span></span></label>
          <label for="damage">单发伤害 <span class="number-unit"><input id="damage" type="number" min="1" step="1" value="24" inputmode="numeric" required aria-describedby="config-status"><span>点</span></span></label>
          <output id="cadence" for="rpm"></output>
        </fieldset>
        <p id="config-status" role="status" hidden></p>
        <div class="mixer">
          <fieldset><legend class="sr-only">靶场音轨</legend>
            <label class="switch"><input id="shot-mix" type="checkbox" checked><i aria-hidden="true"></i>开火声</label>
            <label class="switch"><input id="hit-mix" type="checkbox" checked><i aria-hidden="true"></i>命中音</label>
          </fieldset>
          <label class="volume">总音量 <input id="volume" type="range" min="0" max="100" value="65"><output for="volume" id="volume-value">65%</output></label>
        </div>
        <p id="audio-status" role="status" hidden></p>
      </section>

      <section class="panel bank-panel" aria-labelledby="bank-heading">
        <div class="bank-intro"><h2 id="bank-heading">事件试听</h2><p>点击波形，单独听枪声或一种命中音。</p></div>
        <div id="bank" class="bank"></div>
      </section>
    </div>

    <section class="panel trace" aria-labelledby="trace-heading">
      <div class="trace-head"><h2 id="trace-heading">命中记录</h2><output id="count">0 次命中</output></div>
      <p class="trace-empty" id="empty-log">命中后可在这里查看每一发实际扣除的护盾与生命。</p>
      <ol id="log" hidden></ol>
    </section>
    <div class="sr-only" id="announce" role="status" aria-atomic="true"></div>
  </main>
</body>
</html>
